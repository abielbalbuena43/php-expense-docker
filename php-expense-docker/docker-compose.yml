version: '3.8'

services:
  web:
    build: .
    container_name: php_expense_web
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: php_expense_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: php_expense
    volumes:
      - expense_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: php_expense_pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  expense_db_data: